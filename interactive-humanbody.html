<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Interactive Human Body — Click to Explore</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050810;--panel:#0c0f1a;--card:#111828;--border:#1e2640;
  --text:#dde4f5;--muted:#5a6a8a;--accent:#4fc3f7;
  --green:#4ade80;--red:#f87171;--gold:#fbbf24;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;display:flex;flex-direction:column}

/* ── HEADER ── */
header{flex-shrink:0;padding:16px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(5,8,16,.95);backdrop-filter:blur(10px);z-index:50}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:700;color:#fff;letter-spacing:-.01em}
.logo span{color:var(--accent)}
.hint{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.hint b{color:var(--accent);font-weight:500}

/* ── MAIN LAYOUT ── */
.main{flex:1;display:flex;overflow:hidden}

/* ── BODY PANEL ── */
.body-panel{flex:0 0 420px;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;border-right:1px solid var(--border);background:radial-gradient(ellipse 80% 80% at 50% 50%,rgba(79,195,247,.04) 0%,transparent 70%)}
.body-wrap{position:relative;width:280px}

/* glow ring when part hovered */
.body-wrap svg .organ-zone{cursor:pointer;transition:all .2s}
.body-wrap svg .organ-zone:hover .zone-fill{opacity:.35!important}
.body-wrap svg .organ-zone.active .zone-fill{opacity:.5!important}

/* ── SVG BODY ── */
#bodySVG{width:100%;height:auto;filter:drop-shadow(0 0 40px rgba(79,195,247,.08))}

/* pulse rings on hover */
.pulse-ring{animation:pulseRing 1.8s ease-out infinite;transform-origin:center}
@keyframes pulseRing{0%{opacity:.6;stroke-width:2}100%{opacity:0;stroke-width:8;r:30}}

/* ── DETAIL PANEL ── */
.detail-panel{flex:1;overflow-y:auto;padding:32px 36px;background:var(--panel)}
.detail-panel::-webkit-scrollbar{width:5px}
.detail-panel::-webkit-scrollbar-thumb{background:#1e2640;border-radius:3px}

/* placeholder */
.placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;color:var(--muted)}
.placeholder-icon{font-size:4rem;opacity:.3}
.placeholder h2{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--muted);font-weight:400}
.placeholder p{font-size:.88rem;max-width:300px;line-height:1.6}

/* organ detail */
.organ-header{display:flex;align-items:flex-start;gap:18px;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.organ-icon-big{width:72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:2.8rem;flex-shrink:0;background:rgba(79,195,247,.08);border:1px solid rgba(79,195,247,.18)}
.organ-title{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:700;color:#fff;line-height:1;margin-bottom:4px}
.organ-latin{font-style:italic;color:var(--muted);font-size:.85rem;margin-bottom:10px}
.organ-badges{display:flex;gap:7px;flex-wrap:wrap}
.badge{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:5px}
.badge-sys{background:rgba(79,195,247,.12);color:var(--accent);border:1px solid rgba(79,195,247,.22)}
.badge-vital{background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.22)}

.organ-desc{font-size:.92rem;color:#9aa5c0;line-height:1.75;margin-bottom:24px}

/* quick facts strip */
.facts-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:28px}
.fact-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.fact-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.fact-val{font-size:.9rem;font-weight:600;color:var(--text)}

/* section headings */
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-icon{font-size:1.1rem}
.sec-title{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:700;color:#fff}
.sec-line{flex:1;height:1px;background:var(--border)}

/* functions */
.fn-list{display:flex;flex-direction:column;gap:7px;margin-bottom:28px}
.fn-item{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:#8a9ab8;line-height:1.55}
.fn-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px;flex-shrink:0}

/* food section */
.food-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:700px){.food-grid{grid-template-columns:1fr}}
.food-col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.food-col-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.food-col-icon{font-size:1.3rem}
.food-col-title{font-size:.82rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.food-col.good .food-col-title{color:var(--green)}
.food-col.bad .food-col-title{color:var(--red)}
.food-col.good{border-color:rgba(74,222,128,.15)}
.food-col.bad{border-color:rgba(248,113,113,.15)}
.food-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.food-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.food-emoji{font-size:1.3rem;flex-shrink:0;margin-top:1px}
.food-name{font-size:.82rem;font-weight:600;color:var(--text);margin-bottom:2px}
.food-why{font-size:.76rem;color:var(--muted);line-height:1.5}

/* deficiency section */
.deficiency-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.def-item{background:var(--card);border:1px solid rgba(251,191,36,.12);border-radius:10px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
.def-em{font-size:1.2rem;flex-shrink:0}
.def-name{font-size:.83rem;font-weight:600;color:var(--gold);margin-bottom:3px}
.def-desc{font-size:.78rem;color:var(--muted);line-height:1.55}

/* diseases */
.dis-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.dis-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
.dis-name{font-weight:600;font-size:.86rem;color:var(--text);margin-bottom:4px}
.dis-tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-left:7px}
.dis-desc{font-size:.78rem;color:var(--muted);line-height:1.55}

/* did you know */
.dyk-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.dyk-item{background:rgba(79,195,247,.04);border:1px solid rgba(79,195,247,.12);border-radius:10px;padding:11px 14px;font-size:.8rem;color:#8a9ab8;line-height:1.6;display:flex;gap:10px}
.dyk-star{color:var(--accent);flex-shrink:0;margin-top:1px}

/* ── MODAL for mobile ── */
#modal{display:none;position:fixed;inset:0;z-index:200;padding:16px;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.m-overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px)}
.m-sheet{position:relative;z-index:10;background:var(--panel);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-height:80vh;overflow-y:auto;padding:24px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.m-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.06);border:none;color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.m-close:hover{background:var(--red);color:#fff}

/* scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#1e2640;border-radius:3px}

/* animations */
.organ-detail{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ══ RESPONSIVE ══ */

/* Tablet landscape: shrink body panel */
@media(max-width:1024px){
  .body-panel{flex:0 0 320px;padding:14px}
  .body-wrap{width:220px}
  .detail-panel{padding:24px 22px}
  .organ-title{font-size:2rem}
  .facts-strip{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}

/* Tablet portrait & large mobile: stack vertically */
@media(max-width:768px){
  html,body{height:auto;overflow:auto}
  body{overflow-x:hidden}
  .main{flex-direction:column;overflow:visible;height:auto}

  /* header compact */
  header{padding:12px 16px;flex-wrap:wrap;gap:6px}
  .logo{font-size:1.2rem}
  .hint{font-size:.72rem;width:100%;text-align:center}

  /* body panel becomes a horizontal scrollable strip at top */
  .body-panel{
    flex:none;
    width:100%;
    border-right:none;
    border-bottom:1px solid var(--border);
    padding:16px 20px 10px;
    background:radial-gradient(ellipse 80% 60% at 50% 30%,rgba(79,195,247,.05) 0%,transparent 70%);
    justify-content:center;
    align-items:flex-start;
  }
  .body-wrap{width:160px;margin:0 auto}

  /* organ labels smaller inside SVG viewport */
  #bodySVG text{font-size:7px!important}

  /* detail panel full width below */
  .detail-panel{
    flex:none;
    width:100%;
    overflow-y:visible;
    padding:20px 16px 40px;
    min-height:60vh;
  }

  /* organ header stacked */
  .organ-header{flex-wrap:wrap;gap:12px}
  .organ-icon-big{width:56px;height:56px;font-size:2.2rem}
  .organ-title{font-size:1.7rem}
  .organ-desc{font-size:.87rem}

  /* facts smaller */
  .facts-strip{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:20px}
  .fact-box{padding:10px 12px}
  .fact-val{font-size:.82rem}

  /* food grid already 1 col at 700px, ensure it */
  .food-grid{grid-template-columns:1fr;gap:12px}
  .food-col{padding:14px}

  /* section headings */
  .sec-title{font-size:1.1rem}

  /* placeholder centred nicely */
  .placeholder{padding:30px 20px;height:auto;min-height:200px}
  .placeholder-icon{font-size:3rem}
  .placeholder h2{font-size:1.4rem}
}

/* Small mobile: tighten further */
@media(max-width:480px){
  header{padding:10px 12px}
  .logo{font-size:1.1rem}
  .hint{font-size:.68rem}

  .body-panel{padding:12px 12px 8px}
  .body-wrap{width:140px}

  .detail-panel{padding:16px 12px 40px}

  .organ-icon-big{width:48px;height:48px;font-size:1.9rem;border-radius:12px}
  .organ-title{font-size:1.5rem}
  .organ-latin{font-size:.78rem}
  .organ-desc{font-size:.84rem;line-height:1.65}

  .facts-strip{grid-template-columns:1fr 1fr;gap:7px}
  .fact-label{font-size:.62rem}
  .fact-val{font-size:.8rem}

  .fn-item{font-size:.82rem}
  .food-name{font-size:.8rem}
  .food-why{font-size:.73rem}
  .def-name{font-size:.8rem}
  .def-desc{font-size:.74rem}
  .dis-name{font-size:.82rem}
  .dis-desc{font-size:.74rem}
  .dyk-item{font-size:.77rem;padding:9px 12px}

  .badge{font-size:.64rem;padding:2px 8px}
  .sec-title{font-size:1rem}
  .sec-icon{font-size:.95rem}

  /* organ hint bar */
  .hint b{display:block}
}

/* Very small: 360px and below */
@media(max-width:360px){
  .body-wrap{width:120px}
  .organ-title{font-size:1.3rem}
  .facts-strip{grid-template-columns:1fr 1fr}
  .detail-panel{padding:14px 10px 40px}
}

/* Desktop widescreen: give detail panel more room */
@media(min-width:1400px){
  .body-panel{flex:0 0 460px}
  .body-wrap{width:310px}
  .detail-panel{padding:36px 48px}
  .organ-title{font-size:2.8rem}
  .facts-strip{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}

/* Smooth scroll on mobile detail area */
@media(max-width:768px){
  html{scroll-behavior:smooth}
  .detail-panel{-webkit-overflow-scrolling:touch}
}
</style>
</head>
<body>

<header>
  <div class="logo">Human<span>Body</span> Explorer</div>
  <div class="hint">👆 <b>Click any body part</b> to explore its details</div>
</header>

<div class="main">
  <!-- BODY DIAGRAM -->
  <div class="body-panel">
    <div class="body-wrap">
      <svg id="bodySVG" viewBox="0 0 280 580" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bodyGrad" cx="50%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#1e2d4a"/>

        </defs>

        <!-- BODY SILHOUETTE -->
        <!-- Head -->
        <ellipse cx="140" cy="52" rx="38" ry="46" fill="#1a2035" stroke="#2a3a5a" stroke-width="1.5"/>
        <!-- Neck -->

        <!-- Torso -->
        <path d="M90 112 Q80 130 82 200 Q82 260 90 280 L96 290 L184 290 L190 280 Q198 260 198 200 Q200 130 190 112 Z" fill="#1a2035" stroke="#2a3a5a" stroke-width="1.5"/>

        <ellipse cx="204" cy="125" rx="22" ry="14" fill="#1a2035" stroke="#2a3a5a" stroke-width="1.5"/>
        <!-- Left Arm -->
        <path d="M58 125 Q44 155 46 200 Q47 220 52 240" stroke="#2a3a5a" stroke-width="18" stroke-linecap="round" fill="none"/>

        <!-- Left Hand -->

        <!-- Right Hand -->
        <ellipse cx="228" cy="248" rx="12" ry="16" fill="#1a2035" stroke="#2a3a5a" stroke-width="1.5"/>
        <!-- Pelvis -->
        <path d="M90 285 Q80 310 85 330 L96 340 L184 340 L195 330 Q200 310 190 285 Z" fill="#1a2035" stroke="#2a3a5a" stroke-width="1.5"/>
        <!-- Left Leg -->
        <path d="M105 338 Q98 380 100 430 Q100 470 104 510" stroke="#2a3a5a" stroke-width="22" stroke-linecap="round" fill="none"/>
        <path d="M105 338 Q98 380 100 430 Q100 470 104 510" stroke="#1a2035" stroke-width="20" stroke-linecap="round" fill="none"/>
        <!-- Right Leg -->
        <path d="M175 338 Q182 380 180 430 Q180 470 176 510" stroke="#2a3a5a" stroke-width="22" stroke-linecap="round" fill="none"/>
        <path d="M175 338 Q182 380 180 430 Q180 470 176 510" stroke="#1a2035" stroke-width="20" stroke-linecap="round" fill="none"/>
        <!-- Left Foot -->
        <ellipse cx="104" cy="520" rx="18" ry="10" fill="#1a2035" stroke="#2a3a5a" stroke-width="1.5"/>
        <!-- Right Foot -->
        <ellipse cx="176" cy="520" rx="18" ry="10" fill="#1a2035" stroke="#2a3a5a" stroke-width="1.5"/>

        <!-- ══ CLICKABLE ORGAN ZONES ══ -->

        <!-- BRAIN -->
        <g class="organ-zone" id="zone-brain" onclick="showOrgan('brain')" title="Brain">
          <ellipse class="zone-fill" cx="140" cy="46" rx="32" ry="36" fill="#a78bfa" opacity=".15"/>
          <ellipse cx="140" cy="46" rx="32" ry="36" fill="transparent" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3" opacity=".6"/>
          <circle cx="140" cy="46" r="6" fill="#a78bfa" opacity=".9" filter="url(#glow)"/>
          <text x="140" y="50" text-anchor="middle" font-size="8" fill="#a78bfa" font-family="Outfit" font-weight="600" opacity=".9">Brain</text>
        </g>

        <!-- EYES -->

        <!-- LUNGS -->

        </g>

        <!-- HEART -->
        <g class="organ-zone" id="zone-heart" onclick="showOrgan('heart')" title="Heart">
          <ellipse class="zone-fill" cx="134" cy="160" rx="16" ry="16" fill="#e84d4d" opacity=".2"/>
          <path d="M134 168 Q124 158 124 152 Q124 144 134 148 Q144 144 144 152 Q144 158 134 168Z" fill="#e84d4d" opacity=".75" filter="url(#glow)"/>
          <text x="134" y="180" text-anchor="middle" font-size="7.5" fill="#e84d4d" font-family="Outfit" font-weight="600" opacity=".9">Heart</text>
        </g>

        <!-- LIVER -->
        <g class="organ-zone" id="zone-liver" onclick="showOrgan('liver')" title="Liver">
          <ellipse class="zone-fill" cx="152" cy="210" rx="26" ry="18" fill="#f0a04b" opacity=".15"/>
          <ellipse cx="152" cy="210" rx="26" ry="18" fill="transparent" stroke="#f0a04b" stroke-width="1.5" stroke-dasharray="4 3" opacity=".6"/>

        <!-- STOMACH -->
        <g class="organ-zone" id="zone-stomach" onclick="showOrgan('stomach')" title="Stomach">

          <ellipse cx="126" cy="215" rx="18" ry="14" fill="transparent" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" opacity=".6"/>
          <circle cx="118" cy="212" r="4" fill="#fbbf24" opacity=".85" filter="url(#glow)"/>
          <text x="112" y="236" text-anchor="middle" font-size="7" fill="#fbbf24" font-family="Outfit" font-weight="600" opacity=".9">Stomach</text>
        </g>

        <!-- KIDNEY -->
        <g class="organ-zone" id="zone-kidneys" onclick="showOrgan('kidneys')" title="Kidneys">
          <ellipse class="zone-fill" cx="116" cy="240" rx="12" ry="16" fill="#60a5fa" opacity=".15"/>
          <ellipse class="zone-fill" cx="164" cy="240" rx="12" ry="16" fill="#60a5fa" opacity=".15"/>
          <ellipse cx="116" cy="240" rx="12" ry="16" fill="transparent" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 2" opacity=".6"/>
          <ellipse cx="164" cy="240" rx="12" ry="16" fill="transparent" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 2" opacity=".6"/>
          <circle cx="116" cy="240" r="4" fill="#60a5fa" opacity=".8" filter="url(#glow)"/>
          <circle cx="164" cy="240" r="4" fill="#60a5fa" opacity=".8" filter="url(#glow)"/>
          <text x="140" y="263" text-anchor="middle" font-size="7.5" fill="#60a5fa" font-family="Outfit" font-weight="600" opacity=".9">Kidneys</text>
        </g>

        <!-- PANCREAS -->

    {e:'🫐',n:'Blueberries',w:'Anthocyanins reduce kidney inflammation and oxidative stress. Studies show significant slowing of kidney disease progression.'},
    {e:'🥙',n:'Cauliflower',w:'Low in potassium and phosphorus (critical for CKD patients), yet rich in Vitamin C, folate, and fibre — ideal kidney-friendly vegetable.'},
    {e:'🫒',n:'Olive Oil',w:'Anti-inflammatory oleocanthal protects kidney tubules from oxidative damage and reduces the inflammatory burden on filtering nephrons.'},
  ],
  badFoods:[
    {e:'🧂',n:'Excess Salt (>5g/day)',w:'Forces kidneys to work harder to excrete excess sodium, raises blood pressure in the renal arteries, and accelerates nephron (filter unit) destruction.'},
    {e:'🥩',n:'Excess Red & Processed Meat',w:'High protein creates large amounts of urea that overburdens kidney filters. Increases risk of kidney stones and accelerates CKD progression.'},
    {e:'🥤',n:'Sugary Drinks & Fructose',w:'Fructose metabolism creates uric acid, causing gout and uric acid kidney stones. Also causes insulin resistance that damages kidney blood vessels.'},
    {e:'💊',n:'Excess NSAIDs (Ibuprofen)',w:'Chronic NSAID use restricts blood flow to kidneys, directly damaging filtering nephrons — a leading cause of drug-induced kidney injury.'},
    {e:'🍺',n:'Alcohol',w:'Dehydrates the body, raises blood pressure, and directly impairs the kidneys\' ability to filter blood and maintain electrolyte balance.'},
  ],
  deficiency:[
    {e:'💧',n:'Water / Dehydration',d:'Concentrated urine damages nephrons, promotes kidney stone formation (calcium oxalate and uric acid), and impairs waste removal.'},
    {e:'☀️',n:'Vitamin D Deficiency',d:'The kidneys activate Vitamin D. In kidney disease, this fails — causing bone loss, immune dysfunction, and cardiovascular complications.'},
    {e:'🔴',n:'Potassium Deficiency',d:'Kidneys regulate potassium precisely. Low potassium increases blood pressure, promotes kidney cyst formation, and impairs renal tubular function.'},
    {e:'⚡',n:'Omega-3 Deficiency',d:'Without anti-inflammatory omega-3s, kidney inflammation progresses — Omega-3 supplementation slows CKD progression significantly.'},
  ],
  diseases:[{n:'Chronic Kidney Disease',sev:'Progressive',d:'Gradual loss of nephrons — often from diabetes or hypertension. Progresses silently until severe impairment.'},{n:'Kidney Stones',sev:'Painful',d:'Mineral crystals form in the kidney — can obstruct urinary flow causing excruciating colicky pain.'},{n:'Polycystic Kidney Disease',sev:'Genetic',d:'Thousands of cysts replace kidney tissue, destroying function over decades.'},{n:'Acute Kidney Injury',sev:'Emergency',d:'Sudden kidney failure from dehydration, toxins, or reduced blood flow — reversible if caught early.'}],
  dyk:['Kidneys filter 180 litres of blood per day but produce only 1–2 litres of urine — they reabsorb 99% of what they filter.','The kidneys maintain blood pH within ±0.05 of 7.40 — a margin finer than the finest laboratory pH meter.','You can live with just one kidney — the remaining one grows larger and increases its function by up to 75%.','EPO (erythropoietin) from the kidneys is the same hormone abused by cheating endurance athletes.']
},

eyes:{
  name:'Eyes', latin:'Oculi', icon:'👁️', system:'Nervous System', vital:false,
  color:'#60a5fa',
  desc:'The eyes are extraordinary precision optical instruments — each one containing 130 million photoreceptors that convert light into the neural signals your brain interprets as vision. They can distinguish up to 10 million different colours, adapt to light levels across a 10-billion-fold range, and process images at 60+ frames per second, all within a sphere just 2.5 cm in diameter.',
  facts:[{l:'Photoreceptors',v:'~130 million'},{l:'Colours detected',v:'~10 million'},{l:'Rods',v:'~120 million (dim light)'},{l:'Cones',v:'~6–7 million (colour)'},{l:'Diameter',v:'~2.5 cm'},{l:'Processing speed',v:'~13 milliseconds'}],
  functions:['Capture focused light images on the retina via the refractive cornea and adjustable lens','Convert light into electrical signals via rod (low light) and cone (colour) photoreceptors','Transmit ~1.2 million nerve fibres of visual data to the occipital cortex via the optic nerve','Enable 3D depth perception through stereoscopic binocular vision','Adapt to extreme light variation via pupil size control (2–8 mm range)','Protect themselves via tear film, eyelids, blink reflex, and sunlight-triggered constriction'],
  goodFoods:[
    {e:'🥕',n:'Carrots & Sweet Potato',w:'Beta-carotene converts to Vitamin A — essential for producing rhodopsin in rod cells. Deficiency causes night blindness.'},
    {e:'🥬',n:'Spinach, Kale & Leafy Greens',w:'Lutein and zeaxanthin concentrate in the macula, filtering blue light and reducing macular degeneration risk by 43%.'},
    {e:'🐟',n:'Fatty Fish',w:'DHA Omega-3 is the structural fat of the retina. Deficiency causes dry eyes, macular degeneration, and retinal thinning.'},
    {e:'🍊',n:'Citrus Fruits',w:'Vitamin C reduces cataract risk by 33% and slows macular degeneration — essential for maintaining the eye\'s lens clarity.'},
    {e:'🥚',n:'Eggs',w:'Yolks provide lutein, zeaxanthin, and Vitamin E in a highly bioavailable form — more absorbable than from plant sources alone.'},
    {e:'🫐',n:'Bilberries / Blueberries',w:'Anthocyanins improve night vision, reduce eye fatigue from screens, and protect retinal blood vessels.'},
  ],
  badFoods:[
    {e:'🍟',n:'Trans Fats / Fried Foods',w:'Associated with macular degeneration — trans fats interfere with Omega-3 incorporation into retinal cell membranes, degrading vision quality.'},
    {e:'🥤',n:'Sugary Foods & High GI Diet',w:'Blood sugar spikes damage retinal blood vessels, causing diabetic retinopathy — the leading cause of blindness in working-age adults.'},
    {e:'🧂',n:'Excess Salt',w:'Raises blood pressure which damages the tiny, fragile blood vessels of the retina — a major driver of hypertensive retinopathy.'},
    {e:'🍺',n:'Alcohol',w:'Causes optic neuropathy (nerve damage), cataracts, macular degeneration, and depletes B12 which is critical for optic nerve health.'},
    {e:'☕',n:'Excess Caffeine',w:'Can acutely raise intraocular pressure — a risk factor for glaucoma — in genetically susceptible individuals.'},
  ],
  deficiency:[
    {e:'🔴',n:'Vitamin A Deficiency',d:'Causes night blindness first, then xerophthalmia (dry eye), corneal ulcers, and ultimately complete irreversible blindness. #1 cause of preventable blindness worldwide in children.'},
    {e:'⚡',n:'Omega-3 (DHA) Deficiency',d:'The retina is 50% DHA by weight. Deficiency causes dry eye syndrome, reduced visual acuity, retinal thinning, and macular degeneration.'},
    {e:'💚',n:'Lutein & Zeaxanthin Deficiency',d:'These two carotenoids form the macular pigment that filters harmful blue light. Without them, age-related macular degeneration accelerates significantly.'},
    {e:'💊',n:'Vitamin B12 Deficiency',d:'Damages the optic nerve (optic neuropathy) causing gradual vision loss, colour vision disturbances, and central scotomas.'},
  ],
  diseases:[{n:'Glaucoma',sev:'Progressive',d:'Raised intraocular pressure damages the optic nerve — leading cause of irreversible blindness globally, often called the "silent thief of sight".'},{n:'Age-Related Macular Degeneration',sev:'Progressive',d:'Degradation of the central macula destroys detailed central vision — affects 1 in 4 people over 70.'},{n:'Diabetic Retinopathy',sev:'Serious',d:'High blood sugar damages retinal blood vessels — leading cause of new blindness in working-age adults.'},{n:'Cataracts',sev:'Common',d:'Clouding of the lens impairs vision — the #1 cause of treatable blindness worldwide, easily cured with surgery.'}],
  dyk:['Your eyes can detect a single photon of light in complete darkness — the absolute minimum of light that physically exists.','The retina is the only part of the brain that can be directly observed from outside the body.','Each eye has a blind spot where the optic nerve exits — your brain fills in this gap using surrounding information.','Corneal cells receive no blood supply — they get all their oxygen directly from tears and the air.']
},

pancreas:{
  name:'Pancreas', latin:'Pancreas', icon:'🩷', system:'Digestive & Endocrine', vital:false,
  color:'#f472b6',
  desc:'The pancreas is a remarkable dual-function gland — part factory, part control centre. Its exocrine cells produce a litre and a half of powerful digestive enzymes daily, while its islets of Langerhans (just 1–2% of the organ) produce insulin and glucagon to govern every cell\'s energy supply. It is the organ that makes the difference between a healthy metabolism and diabetes.',
  facts:[{l:'Weight',v:'~80–100 g'},{l:'Length',v:'~15–25 cm'},{l:'Enzyme output/day',v:'~1.5 L'},{l:'Islets',v:'~1 million clusters'},{l:'Key enzymes',v:'Amylase, lipase, trypsin'},{l:'Insulin cells',v:'Beta cells'}],
  functions:['Exocrine: secretes amylase (carbs), lipase (fats), and proteases (proteins) into the duodenum','Exocrine: releases bicarbonate to neutralise stomach acid entering the small intestine','Endocrine: beta-cells secrete insulin when blood glucose rises — the key to cellular glucose uptake','Endocrine: alpha-cells secrete glucagon when glucose falls — triggers liver to release stored glycogen','Endocrine: delta-cells secrete somatostatin to fine-tune both insulin and glucagon output'],
  goodFoods:[
    {e:'🥦',n:'Leafy Greens & Cruciferous Vegetables',w:'Low glycaemic, anti-inflammatory, and rich in magnesium — which is essential for over 300 pancreatic enzyme reactions and insulin signalling.'},
    {e:'🍒',n:'Cherries & Berries',w:'Low sugar, high anthocyanins — reduce pancreatic inflammation and protect beta cells from oxidative destruction.'},
    {e:'🥑',n:'Avocado',w:'Healthy monounsaturated fats improve insulin sensitivity and reduce the glycaemic load of any meal it accompanies.'},
    {e:'🐟',n:'Fatty Fish',w:'Omega-3s reduce pancreatic inflammation and improve insulin receptor sensitivity, reducing Type 2 diabetes risk by 25%.'},
    {e:'🫘',n:'Legumes (Lentils, Beans)',w:'Slow-digesting complex carbohydrates with a very low glycaemic index — ideal for reducing the glycaemic load on beta cells.'},
    {e:'🎋',n:'Turmeric',w:'Curcumin has been shown to protect and even regenerate pancreatic beta cells in early research, and strongly reduces pancreatic inflammation.'},
  ],
  badFoods:[
    {e:'🥤',n:'Sugary Drinks & High-Sugar Foods',w:'Chronically high blood sugar burns out beta cells over time. Daily sugar-sweetened drink consumption raises Type 2 diabetes risk by 26%.'},
    {e:'🥩',n:'Processed & Red Meats',w:'Nitrosamines in processed meat directly damage pancreatic DNA, significantly increasing pancreatic cancer risk — one of the deadliest cancers.'},
    {e:'🍺',n:'Alcohol',w:'The most common trigger of acute pancreatitis — prematurely activates digestive enzymes INSIDE the pancreas, causing self-digestion and severe inflammation.'},
    {e:'🍟',n:'Trans Fats & Fried Foods',w:'Increase systemic inflammation and insulin resistance — forcing beta cells to produce more and more insulin until they eventually fail.'},
    {e:'🍕',n:'Refined Carbohydrates',w:'White bread, white rice, and refined grains cause rapid blood sugar spikes that chronically stress and eventually exhaust beta cells.'},
  ],
  deficiency:[
    {e:'🔴',n:'Magnesium Deficiency',d:'Magnesium is a cofactor in over 300 enzymatic reactions including insulin secretion. Deficiency impairs beta-cell function and worsens insulin resistance.'},
    {e:'☀️',n:'Vitamin D Deficiency',d:'Vitamin D receptors are found on pancreatic beta cells. Deficiency impairs insulin secretion — strongly associated with Type 1 and Type 2 diabetes risk.'},
    {e:'⚡',n:'Chromium Deficiency',d:'Chromium enhances insulin\'s ability to move glucose into cells. Deficiency causes insulin resistance and impaired glucose tolerance.'},
    {e:'💊',n:'Zinc Deficiency',d:'Zinc is stored in insulin crystals within beta cells and is essential for insulin synthesis, storage, and secretion.'},
  ],
  diseases:[{n:'Type 1 Diabetes',sev:'Autoimmune',d:'Immune system destroys beta cells — no insulin produced. Requires lifelong insulin therapy.'},{n:'Type 2 Diabetes',sev:'Common',d:'Beta cell exhaustion and insulin resistance — affects 500 million people globally.'},{n:'Acute Pancreatitis',sev:'Serious',d:'Digestive enzymes activate inside the pancreas, causing devastating self-digestion and inflammation.'},{n:'Pancreatic Cancer',sev:'Deadly',d:'5-year survival rate ~12% due to late diagnosis. Strongly associated with smoking and chronic pancreatitis.'}],
  dyk:['Only 1–2% of the pancreas is made up of hormone-producing islet cells — yet they control the blood sugar of every cell in your entire body.','The discovery of insulin in 1921 by Banting and Best is considered one of the greatest medical achievements in history.','Pancreatic digestive enzymes are strong enough to digest the pancreas itself — they are stored as inactive "pro-enzymes" and only activated in the intestine.','The pancreas produces enough digestive juice each day to fill a large water bottle (1.5 litres).']
},

intestines:{
  name:'Intestines', latin:'Intestinum', icon:'🌀', system:'Digestive System', vital:true,
  color:'#34d399',
  desc:'The intestines are the body\'s primary site of digestion and nutrition — a combined ~8 metres of tubing that absorbs virtually everything you eat. The small intestine (6–7 m) does the work of extracting nutrients across a surface area the size of a badminton court (~30 m²). The large intestine (1.5 m) then reclaims water and hosts 38 trillion gut bacteria — your microbiome — which influences immunity, mood, metabolism, and even brain function.',
  facts:[{l:'Small intestine',v:'~6–7 m long'},{l:'Large intestine',v:'~1.5 m long'},{l:'Surface area (SI)',v:'~30 m²'},{l:'Gut bacteria',v:'~38 trillion'},{l:'Transit time',v:'24–72 hours total'},{l:'Alveoli equivalent',v:'Villi + microvilli'}],
  functions:['Small intestine absorbs all nutrients: amino acids, glucose, fatty acids, vitamins A, D, E, K, B12, and minerals','Large intestine recovers water and electrolytes from indigestible waste, producing formed stool','Houses the gut microbiome — trillions of bacteria that produce vitamins K and B12, short-chain fatty acids, and immune signals','Provides 70–80% of the body\'s immune cells via gut-associated lymphoid tissue (GALT)','Produces gut hormones: serotonin (90% made in gut), GLP-1 (regulates insulin), and CCK (satiety)','Communicates directly with the brain via the enteric nervous system — the "second brain" with 500 million neurons'],
  goodFoods:[
    {e:'🥗',n:'High-Fibre Foods (Vegetables, Fruit, Whole Grains)',w:'Feeds beneficial gut bacteria (prebiotics), reduces transit time, lowers colorectal cancer risk by 40%, and prevents constipation and diverticular disease.'},
    {e:'🫙',n:'Fermented Foods (Yogurt, Kimchi, Kefir, Sauerkraut)',w:'Probiotics introduce beneficial bacteria that crowd out pathogens, reduce inflammation, improve immune function, and even alleviate depression via the gut-brain axis.'},
    {e:'🍌',n:'Bananas (especially slightly unripe)',w:'Rich in resistant starch — a prebiotic fibre that feeds Lactobacillus and Bifidobacterium, the most beneficial gut bacterial species.'},
    {e:'🧅',n:'Garlic, Onions & Leeks',w:'Inulin and fructooligosaccharides in allium vegetables are powerful prebiotics that increase Bifidobacterium populations by up to 7-fold.'},
    {e:'🫘',n:'Legumes & Beans',w:'Dual benefit: insoluble fibre speeds transit time and soluble fibre feeds gut bacteria. Reduces colorectal cancer risk and controls blood sugar.'},
    {e:'🍫',n:'Dark Chocolate',w:'Polyphenols act as prebiotics, significantly increasing Lactobacillus and Bifidobacterium populations while reducing inflammatory Clostridia.'},
  ],
  badFoods:[
    {e:'🍟',n:'Ultra-Processed Foods',w:'Low fibre, high in emulsifiers (lecithin, polysorbate 80) that disrupt the mucus layer protecting the gut lining — dramatically reducing microbiome diversity within 4 days.'},
    {e:'🥩',n:'Excess Red Meat',w:'Produces toxic hydrogen sulfide and N-nitroso compounds via gut bacteria fermentation — strongly linked to colorectal cancer (40% increased risk with daily consumption).'},
    {e:'🍺',n:'Alcohol',w:'Kills beneficial gut bacteria, increases intestinal permeability ("leaky gut"), allows bacterial toxins into the bloodstream — triggering systemic inflammation throughout the body.'},
    {e:'💊',n:'Antibiotics (overuse)',w:'Kill both harmful AND beneficial gut bacteria indiscriminately. A single course can devastate microbiome diversity for up to 2 years.'},
    {e:'🥛',n:'Dairy (for lactose-intolerant)',w:'Undigested lactose ferments in the large intestine causing gas, bloating, cramps, and diarrhoea from osmotic water draw.'},
  ],
  deficiency:[
    {e:'🌿',n:'Fibre Deficiency',d:'Modern Western diets provide ~15g fibre vs. the recommended 30g. Leads to constipation, colorectal cancer, microbiome collapse, and chronic systemic inflammation.'},
    {e:'⚡',n:'Microbiome Depletion',d:'Loss of gut microbial diversity is linked to obesity, diabetes, depression, autoimmune disease, allergies, and even Parkinson\'s and Alzheimer\'s disease.'},
    {e:'💊',n:'Vitamin B12 Deficiency',d:'The ileum absorbs B12 — Crohn\'s disease, surgical removal, or pernicious anaemia destroys this ability, leading to nerve damage and megaloblastic anaemia.'},
    {e:'🔴',n:'Iron Deficiency',d:'Iron is absorbed in the duodenum — any intestinal inflammation (Crohn\'s, coeliac) drastically impairs iron absorption, causing iron-deficiency anaemia.'},
  ],
  diseases:[{n:'Irritable Bowel Syndrome',sev:'Functional',d:'Altered gut-brain signalling causes pain, bloating, and altered bowel habits without structural damage — affects 1 in 7 people.'},{n:'Inflammatory Bowel Disease',sev:'Chronic',d:'Crohn\'s disease and ulcerative colitis cause immune-mediated intestinal destruction — significant quality of life impact.'},{n:'Colorectal Cancer',sev:'Common',d:'#2 cancer killer worldwide — strongly preventable through high-fibre diet and screening colonoscopy.'},{n:'Coeliac Disease',sev:'Autoimmune',d:'Gluten triggers immune destruction of intestinal villi — causing profound malabsorption of all nutrients.'}],
  dyk:['Your gut microbiome contains more bacterial DNA than your entire human genome — you are 57% non-human by cell count.','The gut produces 90–95% of the body\'s serotonin — the "happiness neurotransmitter" — in intestinal cells, not the brain.','The enteric nervous system in your gut has 500 million neurons — more than the spinal cord — and makes decisions independently of the brain.','A diverse, plant-rich diet is the single most evidence-backed intervention to improve gut microbiome health.']
},

skin:{
  name:'Skin', latin:'Cutis', icon:'🧑', system:'Integumentary System', vital:true,
  color:'#fb923c',
  desc:'Skin is your body\'s largest organ — covering ~2 m² and weighing ~5 kg — and its first and most comprehensive line of defence. This remarkable three-layered barrier simultaneously blocks pathogens, UV radiation, chemicals, and physical trauma; regulates body temperature with extraordinary precision; manufactures vitamin D; and provides a sensory interface with the entire world around you.',
  facts:[{l:'Surface area',v:'~1.7–2 m²'},{l:'Weight',v:'~5 kg (15% body weight)'},{l:'Layers',v:'3 (Epidermis, Dermis, Hypodermis)'},{l:'Cell renewal',v:'Every 27 days'},{l:'Sweat glands',v:'~2–4 million'},{l:'Thinnest',v:'0.5 mm (eyelid)'}],
  functions:['Physical barrier against bacteria, viruses, UV radiation, chemicals, and mechanical injury','Regulates core body temperature via sweating (cooling) and blood vessel dilation/constriction (heating)','Synthesises Vitamin D3 from 7-dehydrocholesterol using UV-B sunlight','Provides sensation via millions of receptors: touch, pressure, pain, temperature, and vibration','Prevents dehydration by limiting transepidermal water loss to <10 g/m²/hour','Immune defense via Langerhans cells and dermis-resident T-lymphocytes'],
  goodFoods:[
    {e:'🐟',n:'Fatty Fish (Salmon, Mackerel)',w:'Omega-3 DHA and EPA maintain cell membrane fluidity, reduce UV-induced inflammation, and suppress eczema and psoriasis flares. Natural "internal moisturiser."'},
    {e:'🥑',n:'Avocado',w:'Vitamin E prevents lipid peroxidation in skin cell membranes, while healthy fats maintain skin elasticity and the lipid barrier.'},
    {e:'🍅',n:'Tomatoes (cooked)',w:'Lycopene — 4x more bioavailable from cooked tomatoes — is the most potent natural UV-protective carotenoid, reducing sunburn intensity.'},
    {e:'🫐',n:'Berries',w:'Anthocyanins and Vitamin C protect collagen from oxidative breakdown — maintaining skin firmness and slowing photoageing.'},
    {e:'🥜',n:'Brazil Nuts',w:'Just 2 per day provides the entire recommended daily selenium — essential for glutathione peroxidase, the skin\'s primary antioxidant enzyme.'},
    {e:'💧',n:'Water (Hydration)',w:'Every skin function depends on adequate hydration. Even mild dehydration increases transepidermal water loss, reduces skin elasticity, and worsens all skin conditions.'},
  ],
  badFoods:[
    {e:'🍬',n:'Sugar & High-Glycaemic Foods',w:'Glycation — sugar molecules bonding to collagen and elastin — creates AGEs (Advanced Glycation End-products) that make skin stiff, wrinkled, and dull. One of the primary drivers of skin ageing.'},
    {e:'🍟',n:'Fried & Trans Fat Foods',w:'Increase skin inflammation, trigger acne flares, damage the skin\'s natural lipid barrier, and accelerate collagen breakdown.'},
    {e:'🍺',n:'Alcohol',w:'Causes severe dehydration of skin cells, depletes Vitamin A (critical for cell turnover), dilates blood vessels causing rosacea, and accelerates collagen breakdown.'},
    {e:'🥛',n:'Dairy (for some individuals)',w:'IGF-1 and hormones in dairy trigger excess sebum (oil) production and comedone (blackhead) formation in acne-prone individuals.'},
    {e:'☕',n:'Excess Caffeine',w:'Acts as a diuretic, increasing water loss from skin cells. Excessive consumption worsens dry skin and exacerbates eczema flares.'},
  ],
  deficiency:[
    {e:'☀️',n:'Vitamin D Deficiency',d:'The skin produces Vitamin D — without adequate sun or supplementation, psoriasis, eczema, and inflammatory skin conditions worsen dramatically. Also impairs wound healing.'},
    {e:'🔴',n:'Vitamin C Deficiency (Scurvy)',d:'Vitamin C is essential for collagen synthesis — the structural protein of skin. Deficiency causes weak, bruising skin, wounds that won\'t heal, and eventually scurvy.'},
    {e:'⚡',n:'Omega-3 Deficiency',d:'Without omega-3s, the skin barrier becomes dry, flaky, and inflamed. Eczema, psoriasis, and ichthyosis are all worsened significantly by omega-3 deficiency.'},
    {e:'💊',n:'Zinc Deficiency',d:'Zinc is essential for wound healing, collagen synthesis, and controlling skin oil production. Deficiency causes acne, slow wound healing, hair loss, and dermatitis.'},
  ],
  diseases:[{n:'Eczema (Atopic Dermatitis)',sev:'Chronic',d:'Impaired skin barrier allows allergens and irritants to penetrate — causing chronic inflammation, intense itch, and frequent infections.'},{n:'Psoriasis',sev:'Chronic',d:'Autoimmune overproduction of skin cells creates thick, scaly plaques — can also involve joints (psoriatic arthritis).'},{n:'Melanoma',sev:'Serious',d:'Malignant transformation of melanocytes — most dangerous skin cancer, linked to UV exposure and strongly preventable with sunscreen.'},{n:'Acne Vulgaris',sev:'Common',d:'Clogged follicles from excess sebum + C. acnes bacteria + inflammation — affects 85% of teenagers and many adults.'}],
  dyk:['You shed 30,000–40,000 skin cells every hour — your entire outer layer is replaced every month.','Skin produces ~90% of your body\'s Vitamin D from just 15–30 minutes of midday sun on the face and arms.','Fingerprints are formed in the womb by completely random forces — even identical twins have different prints.','The skin\'s acid mantle (pH 4.5–5.5) acts as a chemical barrier that inhibits most harmful bacteria from colonising your surface.']
},

bladder:{
  name:'Bladder', latin:'Vesica urinaria', icon:'💛', system:'Urinary System', vital:false,
  color:'#818cf8',
  desc:'The bladder is a hollow, remarkably elastic muscular organ that serves as the body\'s urine reservoir. Its specialised lining (urothelium) with unique "umbrella cells" can stretch from 50 mL when empty to over 600 mL when full — then contract forcefully to expel urine through the urethra when you choose. It communicates your need to urinate via stretch receptors that sense volume, allowing you voluntary control.',
  facts:[{l:'Capacity',v:'400–600 mL'},{l:'Urge signal',v:'~200–300 mL'},{l:'Wall muscle',v:'Detrusor muscle'},{l:'Sphincters',v:'2 (internal + external)'},{l:'Lining',v:'Transitional epithelium'},{l:'Voiding frequency',v:'6–8 × per day'}],
  functions:['Stores urine from both kidneys via the two ureters until voluntary urination is convenient','Signals the urge to urinate via stretch receptors when 200–300 mL is reached','Contracts the detrusor muscle to expel urine through the urethra under voluntary control','The internal sphincter relaxes automatically during urination; the external sphincter is consciously controlled','Maintains complete sterility of stored urine through tight epithelial junctions and antimicrobial urothelium'],
  goodFoods:[
    {e:'💧',n:'Water (2.5–3 L/day)',w:'Dilutes urine, reducing its irritating effect on the bladder lining. Adequate hydration is the single most effective preventive measure against UTIs, bladder stones, and bladder cancer.'},
    {e:'🍒',n:'Cranberry Juice (unsweetened)',w:'Proanthocyanidins prevent E. coli from adhering to bladder wall cells — reducing UTI recurrence by 35% in susceptible women.'},
    {e:'🫐',n:'Blueberries',w:'Same mechanism as cranberries — anti-adhesion compounds protect the urothelium (bladder lining) from bacterial colonisation.'},
    {e:'🥦',n:'Cruciferous Vegetables',w:'Sulforaphane from broccoli activates Nrf2 pathways in bladder cells, providing antioxidant protection and reducing bladder cancer risk.'},
    {e:'🍵',n:'Chamomile Tea',w:'Anti-inflammatory and antispasmodic — reduces bladder overactivity and urgency symptoms in overactive bladder syndrome.'},
    {e:'🎋',n:'Pumpkin Seeds',w:'Rich in zinc and antispasmodic compounds that reduce overactive bladder contractions and support pelvic floor muscle health.'},
  ],
  badFoods:[
    {e:'☕',n:'Caffeine (Coffee, Tea, Cola)',w:'Direct bladder irritant — caffeine acts as a diuretic AND irritates the detrusor muscle, worsening urgency, frequency, and incontinence.'},
    {e:'🍺',n:'Alcohol',w:'Potent diuretic that rapidly fills the bladder, irritates the urothelium, and disinhibits the detrusor muscle — dramatically worsening overactive bladder.'},
    {e:'🌶️',n:'Spicy Foods',w:'Capsaicin directly activates TRPV1 pain receptors in the bladder wall — causing urgency, frequency, and pain in people with interstitial cystitis.'},
    {e:'🍋',n:'Citrus & Acidic Foods',w:'Acidic urine from citrus, tomatoes, and vinegar irritates the sensitive urothelial lining — worsening interstitial cystitis and overactive bladder symptoms.'},
    {e:'🥤',n:'Carbonated Drinks',w:'CO2 directly irritates the bladder mucosa, increasing urgency, frequency, and worsening incontinence — even sugar-free sparkling water.'},
  ],
  deficiency:[
    {e:'💧',n:'Dehydration / Inadequate Water',d:'Concentrated urine is highly irritating to the bladder lining, increases UTI risk, promotes bladder stone formation, and increases bladder cancer risk.'},
    {e:'🔴',n:'Vitamin D Deficiency',d:'Vitamin D receptors are found in bladder muscle cells. Deficiency weakens detrusor muscle control and is associated with urinary incontinence and overactive bladder.'},
    {e:'💊',n:'Magnesium Deficiency',d:'Magnesium regulates detrusor muscle contractions. Low magnesium causes bladder hyperactivity, urgency, and nocturnal frequency (nocturia).'},
    {e:'⚡',n:'Omega-3 Deficiency',d:'Anti-inflammatory omega-3s protect the urothelium. Deficiency worsens interstitial cystitis inflammation and increases UTI susceptibility.'},
  ],
  diseases:[{n:'Urinary Tract Infection (UTI)',sev:'Common',d:'Bacterial infection of the bladder (cystitis) — most common infection in women; burning urination, urgency, fever.'},{n:'Overactive Bladder',sev:'Common',d:'Involuntary detrusor contractions cause urgent, frequent urination — affecting 1 in 6 adults.'},{n:'Bladder Cancer',sev:'Serious',d:'Transitional cell carcinoma — painless blood in urine is the classic first sign; strongly linked to smoking.'},{n:'Interstitial Cystitis',sev:'Chronic',d:'Chronic bladder pain and inflammation with no bacterial cause — severely impacts quality of life.'}],
  dyk:['The urothelium (bladder lining) can stretch its cells to 10× their resting size — one of the most elastic tissues in the body.','The bladder can hold up to 1 litre in an emergency — but the urge to urinate starts at just 200–300 mL.','Holding urine for very long periods can stretch the bladder muscle permanently, causing long-term dysfunction.','Bladder control (toilet training) develops between ages 2–4 as the brain\'s prefrontal cortex gains control over the external sphincter.']
},

bones:{
  name:'Bones (Skeleton)', latin:'Ossa / Skeleton', icon:'🦴', system:'Musculoskeletal System', vital:true,
  color:'#e2e8f0',
  desc:'The 206 bones of the adult skeleton are far more than structural scaffolding — they are living, dynamic, metabolically active tissue that constantly remodels itself throughout life. Bones provide structural support, protect vital organs, produce all blood cells in their marrow, store 99% of the body\'s calcium, and secrete hormones that regulate metabolism, insulin sensitivity, and even cognitive function.',

var activeZone = null;

function showOrgan(id){
  var o = DATA[id];
  if(!o) return;

  // highlight zone
  document.querySelectorAll('.organ-zone').forEach(function(z){ z.classList.remove('active'); });
  var zone = document.getElementById('zone-'+id);
  if(zone) zone.classList.add('active');
  activeZone = id;

  document.getElementById('placeholder').style.display = 'none';
  var el = document.getElementById('organDetail');
  el.style.display = 'block';

  var sevColor = {Common:'#60a5fa',Serious:'#f87171',Emergency:'#ff4040',Progressive:'#f0a04b',
    Chronic:'#fbbf24','Silent Killer':'#f87171',Painful:'#f472b6',Autoimmune:'#a78bfa',
    Genetic:'#34d399',Deadly:'#ff4040',Functional:'#4db8e8',Variable:'#9090b0',Autoimmune:'#a78bfa'};

  el.innerHTML = '<div class="organ-detail">'
  // header
  +'<div class="organ-header">'
  +'<div class="organ-icon-big" style="background:'+o.color+'18;border-color:'+o.color+'33">'+o.icon+'</div>'
  +'<div><div class="organ-title" style="color:'+o.color+'">'+o.name+'</div>'
  +'<div class="organ-latin">'+o.latin+'</div>'
  +'<div class="organ-badges">'
  +'<span class="badge badge-sys" style="background:'+o.color+'18;color:'+o.color+';border-color:'+o.color+'33">'+o.system+'</span>'
  +(o.vital?'<span class="badge badge-vital">Vital Organ</span>':'')
  +'</div></div></div>'

  // description
  +'<div class="organ-desc">'+o.desc+'</div>'

  // facts strip
  +'<div class="facts-strip">'+o.facts.map(function(f){
    return '<div class="fact-box"><div class="fact-label">'+f.l+'</div><div class="fact-val">'+f.v+'</div></div>';
  }).join('')+'</div>'

  // functions
  +'<div class="sec-head"><span class="sec-icon">⚙️</span><span class="sec-title">Primary Functions</span><div class="sec-line"></div></div>'
  +'<div class="fn-list">'+o.functions.map(function(f){
    return '<div class="fn-item"><div class="fn-dot" style="background:'+o.color+'"></div><span>'+f+'</span></div>';
  }).join('')+'</div>'

  // FOOD: GOOD
  +'<div class="sec-head"><span class="sec-icon">🍽️</span><span class="sec-title">Food & Nutrition Guide</span><div class="sec-line"></div></div>'
  +'<div class="food-grid">'

  // good foods column
  +'<div class="food-col good">'
  +'<div class="food-col-head"><span class="food-col-icon">✅</span><span class="food-col-title">Best Foods for this Organ</span></div>'
  +o.goodFoods.map(function(f){
    return '<div class="food-item"><span class="food-emoji">'+f.e+'</span><div><div class="food-name">'+f.n+'</div><div class="food-why">'+f.w+'</div></div></div>';
  }).join('')+'</div>'

  // bad foods column
  +'<div class="food-col bad">'
  +'<div class="food-col-head"><span class="food-col-icon">❌</span><span class="food-col-title">Foods That Harm this Organ</span></div>'
  +o.badFoods.map(function(f){
    return '<div class="food-item"><span class="food-emoji">'+f.e+'</span><div><div class="food-name">'+f.n+'</div><div class="food-why">'+f.w+'</div></div></div>';
  }).join('')+'</div>'

  +'</div>'

  // deficiencies
  +'<div class="sec-head"><span class="sec-icon">⚠️</span><span class="sec-title">What Happens When You Don\'t Get Enough</span><div class="sec-line"></div></div>'
  +'<div class="deficiency-list">'+o.deficiency.map(function(d){
    return '<div class="def-item"><span class="def-em">'+d.e+'</span><div><div class="def-name">'+d.n+'</div><div class="def-desc">'+d.d+'</div></div></div>';
  }).join('')+'</div>'

  // diseases
  +'<div class="sec-head"><span class="sec-icon">🏥</span><span class="sec-title">Common Diseases & Conditions</span><div class="sec-line"></div></div>'
  +'<div class="dis-list">'+o.diseases.map(function(d){
    var sc = sevColor[d.sev]||'#606080';
    return '<div class="dis-item"><div class="dis-name">'+d.n
      +'<span class="dis-tag" style="background:'+sc+'22;color:'+sc+';border:1px solid '+sc+'44">'+d.sev+'</span></div>'
      +'<div class="dis-desc">'+d.d+'</div></div>';
  }).join('')+'</div>'

  // did you know
  +'<div class="sec-head"><span class="sec-icon">💡</span><span class="sec-title">Did You Know?</span><div class="sec-line"></div></div>'
  +'<div class="dyk-list">'+o.dyk.map(function(d){
    return '<div class="dyk-item"><span class="dyk-star">★</span><span>'+d+'</span></div>';
  }).join('')+'</div>'

  +'</div>';

  var dp = document.getElementById('detailPanel');
  if(window.innerWidth <= 768){
    setTimeout(function(){ dp.scrollIntoView({behavior:'smooth',block:'start'}); }, 80);
  } else {
    dp.scrollTop = 0;
  }
}
</script>
</body>
</html>
